<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Para-Card-Tilt</title>
      <link rel="stylesheet" href="./src/styles/main.css">
</head>

<body>
      <main>
            <section class="spotlight">

                  <h2 class="heading">

                        <span class="line">We frame the</span>

                        <span class="line">
                              <span class="word">worlds</span>
                              <span class="spot">
                                    <span class="spot-card">
                                          <img src="public/1.webp" alt="">
                                    </span>
                              </span>
                              <span class="word">reality</span>
                        </span>

                        <span class="line">was too</span>

                        <span class="line">
                              <span class="word">small</span>
                              <span class="spot">
                                    <span class="spot-card">
                                          <img src="public/2.webp" alt="">
                                    </span>
                              </span>
                              <span class="word">to</span>
                        </span>

                        <span class="line">Ever hold</span>

                        <span class="line">
                              <span class="word">on</span>
                              <span class="spot">
                                    <span class="spot-card">
                                          <img src="public/3.webp" alt="">
                                    </span>
                              </span>
                              <span class="word">to</span>
                        </span>

                  </h2>

            </section>
      </main>

      <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
